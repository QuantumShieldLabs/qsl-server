name: release-linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/qsl-server dist/qsl-server-linux-x86_64
          chmod 0755 dist/qsl-server-linux-x86_64
          (cd dist && sha256sum qsl-server-linux-x86_64 > qsl-server-linux-x86_64.sha256)
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: qsl-server-linux-x86_64
          path: |
            dist/qsl-server-linux-x86_64
            dist/qsl-server-linux-x86_64.sha256
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Automated release for $tag"
          fi
          gh release upload "$tag" \
            dist/qsl-server-linux-x86_64 \
            dist/qsl-server-linux-x86_64.sha256 \
            --clobber
